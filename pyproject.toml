[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "context-calibrated-beats"
dynamic = ["version"]
description = "Automatic Beat Tracking, Calibration and Click Generation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "Ichin" },
]
keywords = ["audio", "beat tracking", "downbeat", "bpm", "click track"]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "librosa>=0.10.2",
  "matplotlib>=3.8",
  "soundfile>=0.12",
  "platformdirs>=4.0",
  "beat-this>=1.1,<2",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]

[project.urls]
Repository = "https://github.com/THU-Ichin/Context-Calibrated-Beats"
Issues = "https://github.com/THU-Ichin/Context-Calibrated-Beats/issues"
Changelog = "https://github.com/THU-Ichin/Context-Calibrated-Beats/blob/main/CHANGELOG.md"

[project.scripts]
ccb = "context_calibrated_beats.cli:main"

[tool.setuptools]
py-modules = ["API", "CCB"]
packages = ["context_calibrated_beats"]

[tool.setuptools.dynamic]
version = { attr = "CCB.CCB_VERSION" }
