name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CCB
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: python -m unittest discover -s tests

      - name: Check CLI version
        run: ccb --version

      - name: Smoke-test installed package outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import context_calibrated_beats as ccb; assert ccb.__version__ == '1.0.1'; assert callable(ccb.run)"
          python -m context_calibrated_beats --version

  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build

      - name: Check distribution metadata and README rendering
        run: python -m twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
